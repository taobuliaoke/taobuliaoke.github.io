<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Jiayan Gong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f11; color: #ececec; line-height: 1.6; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .contact-card { background: #1a1a1e; border-radius: 16px; padding: 2.5rem; border: 1px solid #2a2a30; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
    p.subtitle { color: #888; font-size: 0.95rem; margin-bottom: 2rem; }
    
    .email-box { background: #0f0f11; border: 1px solid #333; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .email-address { font-family: monospace; font-size: 1.05rem; color: #4da6ff; word-break: break-all; }
    
    .btn-back { display: inline-block; margin-top: 1rem; color: #aaa; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
    .btn-back:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="contact-card">
    <h1>Contact Me</h1>
    <p class="subtitle">If you are interested in collaboration or project commissions, please feel free to contact me via email!</p>
    
    <!-- 邮箱展示框 -->
    <div class="email-box">
      <!-- 替换为你自己的真实邮箱 -->
      <span class="email-address">2711519221@qq.com</span>
    </div>

    <!-- 返回主页链接 -->
    <a href="index.html" class="btn-back">← 返回首页 (Back to Home)</a>
  </div>

</body>
</html>
