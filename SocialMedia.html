<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media - Jiayan Gong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f11; color: #ececec; line-height: 1.6; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { background: #1a1a1e; border-radius: 16px; padding: 2.5rem; border: 1px solid #2a2a30; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
    p.subtitle { color: #888; font-size: 0.95rem; margin-bottom: 2rem; }
    
    /* 社交平台列表 */
    .social-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
    .social-item { display: flex; align-items: center; justify-content: space-between; background: #0f0f11; border: 1px solid #2a2a30; padding: 0.9rem 1.2rem; border-radius: 10px; text-decoration: none; color: #ececec; transition: all 0.2s; }
    .social-item:hover { border-color: #4da6ff; background: #16161c; transform: translateY(-2px); }
    
    .platform-info { display: flex; align-items: center; gap: 0.8rem; }
    .platform-icon { font-size: 1.2rem; }
    .platform-name { font-weight: 500; font-size: 1rem; }
    .arrow { color: #666; font-size: 0.9rem; }
    
    .btn-back { display: inline-block; margin-top: 1rem; color: #aaa; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
    .btn-back:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Social Media</h1>
    <p class="subtitle">Come and find me</p>
    
    <div class="social-list">
      
      <!-- 平台 1: ArtStation (预留)
      <a href="https://www.artstation.com/你的账号" target="_blank" class="social-item">
        <div class="platform-info">
          <span class="platform-icon">🎨</span>
          <span class="platform-name">ArtStation</span>
        </div>
        <span class="arrow">↗</span>
      </a> -->

      <!-- 平台 2: Bilibili / B站 (预留) -->
      <a href="https://space.bilibili.com/2045817964?spm_id_from=333.337.0.0" target="_blank" class="social-item">
        <div class="platform-info">
          <span class="platform-icon">📺</span>
          <span class="platform-name">Bilibili</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <!-- 平台 3: X / Twitter (预留) -->
      <a href="https://x.com/Taobuliaoke" target="_blank" class="social-item">
        <div class="platform-info">
          <span class="platform-icon">🐦</span>
          <span class="platform-name">X (Twitter)</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <!-- 平台 4: 小红书 / 站酷 / LOFTER 等 (预留) -->
      <a href="https://www.xiaohongshu.com/user/profile/64ad41410000000025036234" target="_blank" class="social-item">
        <div class="platform-info">
          <span class="platform-icon">📕</span>
          <span class="platform-name">小红书Redbook</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <!-- 平台 5: GitHub (预留) -->
      <a href="https://weibo.com/u/3608477001" target="_blank" class="social-item">
        <div class="platform-info">
          <span class="platform-icon">👀</span>
          <span class="platform-name">微博weibo</span>
        </div>
        <span class="arrow">↗</span>
      </a>

    </div>

    <!-- 返回主页链接 -->
    <a href="index.html" class="btn-back">← 返回首页 (Back to Home)</a>
  </div>

</body>
</html>
